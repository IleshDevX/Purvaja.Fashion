name: CI/CD Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality Gates & Automated Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: purvaja_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/purvaja_test?schema=public
      PORT: 5001
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/purvaja_test?schema=public
      DIRECT_URL: postgresql://postgres:postgrespassword@localhost:5432/purvaja_test?schema=public
      REDIS_URL: redis://localhost:6379
      RATE_LIMIT_REDIS_URL: redis://localhost:6379/1
      FRONTEND_URL: http://localhost:5174
      CORS_ORIGIN: http://localhost:5174,http://localhost:4174
      EMAIL_FROM: noreply@purvaja.fashion
      INITIAL_ADMIN_EMAIL: ci-admin@example.invalid
      VITE_API_URL: /api/v1
      VITE_APP_NAME: Purvaja Fashion - Atelier CI

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create restricted disposable test role
        # Bootstrap uses the disposable CI service only; later steps use a
        # database-owning role with no cluster administration privileges.
        run: node backend/tests/bootstrap-ci.mjs

      - name: Validate Prisma schema with restricted test credentials
        run: pnpm db:validate

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Deploy Prisma migrations to fresh CI database
        run: pnpm db:migrate

      - name: Verify migration replay and schema agreement
        run: |
          pnpm db:migrate:deploy
          pnpm --filter @ecommerce/prototype-b-backend exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Seed deterministic test fixtures (50 products / 300 variants)
        run: pnpm db:seed

      - name: Execute monorepo linting
        run: pnpm lint

      - name: Execute TypeScript typechecks
        run: pnpm typecheck

      - name: Build production bundles (Backend & Frontend)
        run: pnpm build

      - name: Run backend test suite with coverage
        run: pnpm --filter @ecommerce/prototype-b-backend test:coverage

      - name: Verify shared request quotas against disposable Redis
        run: pnpm --filter @ecommerce/prototype-b-backend exec vitest run tests/unit/rate-limit-store.live.test.ts

      - name: Run frontend test suite with coverage
        run: pnpm --filter @ecommerce/prototype-b test:coverage

      - name: Install Playwright Browsers (Chromium, Firefox, WebKit)
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Verify cross-browser acceptance suite
        run: pnpm test:e2e

      - name: Verify clean git tree (no unstaged artifacts, drift, or untracked files)
        run: |
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is dirty! Untracked or modified files found:"
            git status --porcelain
            exit 1
          fi
