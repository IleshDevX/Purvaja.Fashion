services:
  postgres:
    image: postgres:16-alpine
    container_name: purvaja-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-purvaja_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-purvaja_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - purvaja_net

  redis:
    image: redis:7-alpine
    container_name: purvaja-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - purvaja_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: purvaja-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      # This compose file is a local integration stack. Production deploys
      # must provide staging/production secrets and a real payment provider.
      NODE_ENV: development
      PORT: 5001
      HOST: 0.0.0.0
      TRUST_PROXY: 1
      DATABASE_URL: postgresql://${POSTGRES_USER:-purvaja_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-purvaja_db}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-purvaja_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-purvaja_db}?schema=public
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_REDIS_URL: redis://redis:6379/1
      CORS_ORIGIN: http://localhost:5173,http://localhost:5174,http://localhost:3000
      FRONTEND_URL: http://localhost:5173
      PAYMENT_PROVIDER: demo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('http');http.get('http://localhost:5001/readyz',(r)=>{process.exit(r.statusCode===200?0:1);}).on('error',()=>process.exit(1));\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - purvaja_net

volumes:
  postgres_data:
    name: purvaja_postgres_data
  redis_data:
    name: purvaja_redis_data

networks:
  purvaja_net:
    name: purvaja_network
