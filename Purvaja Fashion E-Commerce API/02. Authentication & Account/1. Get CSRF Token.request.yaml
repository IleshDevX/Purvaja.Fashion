$kind: http-request
description: Fetches a fresh CSRF token and sets the purvaja_csrf cookie. Saves token to collection variable.
url: "{{baseUrl}}/api/v1/auth/csrf"
method: GET
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          var json = pm.response.json();
          if (json.data && json.data.csrfToken) {
              pm.collectionVariables.set('csrfToken', json.data.csrfToken);
              console.log('CSRF Token saved: ' + json.data.csrfToken);
          }
      }
    language: text/javascript
order: 1000
