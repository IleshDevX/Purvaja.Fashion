$kind: http-request
url: "{{baseUrl}}/api/v1/cart"
method: GET
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          var json = pm.response.json();
          if (json.data && json.data.items && json.data.items.length > 0) {
              pm.collectionVariables.set('cartItemId', json.data.items[0].id);
          }
      }
    language: text/javascript
order: 1000
